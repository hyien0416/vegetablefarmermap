<!doctype html>
<html lang="zh-Hant">
<head>

<title>合作社蔬菜農友互動地圖</title>
<style>
:root{--green:#2f6b3b;--green2:#4f8a55;--cream:#f6f3e8;--ink:#253127;--muted:#66756b;--card:#fff;--line:#d9e1d8;--hover:#f0b94d;--selected:#e69a32;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--ink)}
header{padding:26px 24px 18px;background:linear-gradient(135deg,#285e34,#4d874d);color:#fff}
header h1{margin:0 0 8px;font-size:clamp(25px,4vw,42px)} header p{margin:0;opacity:.94;line-height:1.75;max-width:900px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
input,select,button,a.btn{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);text-decoration:none}
input{min-width:220px;flex:1} button,.btn{cursor:pointer} .primary{background:var(--green);color:#fff!important;border-color:var(--green)}
.legend{display:flex;gap:15px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 2px 10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)} .dot.has{background:linear-gradient(135deg,#6ea8d9,#e1a35b,#7fba78)} .dot.none{background:rgba(150,160,150,.45)} .dot.sel{background:var(--selected)}
.layout{display:grid;grid-template-columns:minmax(390px,1.15fr) minmax(330px,.85fr);gap:18px;padding:18px;max-width:1440px;margin:auto}
.mapcard,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(32,64,38,.06)}
.mapcard{padding:14px;min-height:700px;position:relative} #map{width:100%;height:640px;display:block}
.map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px 4px 8px}
.map-head h2{margin:0;font-size:20px} .map-head p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.county{fill:var(--county-color,#dfe5dd);stroke:#fff;stroke-width:1.35;cursor:pointer;transition:fill .15s,filter .15s,stroke-width .15s,opacity .15s;outline:none}
.county.has{opacity:1}.county.no-data{opacity:.55}
.county:hover,.county:focus{fill:var(--hover);opacity:1;stroke-width:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}.county.selected{fill:var(--selected);opacity:1;stroke-width:2}
.county-label{font-size:13px;font-weight:800;fill:#1f3625;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:auto;cursor:pointer;text-anchor:middle}
.county-label.no-data{fill:#758078;font-weight:600;font-size:11.5px}.county-label-hit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
.tip{position:fixed;display:none;pointer-events:auto;z-index:60;width:min(410px,calc(100vw - 24px));max-height:72vh;overflow:hidden;background:#203827;color:#fff;padding:0;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.24);font-size:14px;line-height:1.55;cursor:default}
.tip-head{padding:13px 15px 9px;background:#203827;border-bottom:1px solid rgba(255,255,255,.14)}
.tip h3{margin:0 0 5px;font-size:18px}.tip .tip-meta{opacity:.78;margin-bottom:3px}.tip-scroll-hint{font-size:12px;color:#d9eadc;margin-top:5px}
.tip-scroll{max-height:min(55vh,470px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:0 15px 10px}
.tip-scroll::-webkit-scrollbar{width:9px}.tip-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:10px}.tip-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.34);border-radius:10px}
.tip .tip-row{padding:8px 0;border-top:1px solid rgba(255,255,255,.15)}.tip .tip-row:first-child{border-top:0}.tip .tip-name{font-weight:800}.tip .tip-items{opacity:.88;font-size:13px}
.panel{padding:18px;height:700px;overflow:auto} .panel h2{margin:0 0 7px} .meta{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5}
.county-summary{background:#f2f7ee;border:1px solid #dfe9da;padding:12px;border-radius:14px;margin-bottom:12px} .county-summary strong{font-size:18px}
.farmer{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;cursor:pointer;background:#fcfdf9;transition:.15s} .farmer:hover,.farmer:focus{border-color:#87a98b;background:#f4f8ef;outline:2px solid rgba(47,107,59,.16)} 
.name{font-weight:800;font-size:17px} .town{display:inline-block;font-size:12px;color:#fff;background:#718a72;border-radius:999px;padding:3px 8px;margin-left:6px} .items{margin-top:7px;color:#445348;line-height:1.6}
.item-chip{display:inline-block;background:#edf4e8;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px 3px 2px 0}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;z-index:80;box-shadow:-15px 0 45px rgba(0,0,0,.18);transform:translateX(105%);transition:.25s;overflow:auto} .drawer.open{transform:none}
.close{position:sticky;top:10px;float:right;margin:10px 12px;border:0;background:#eef3eb;z-index:3} .hero{aspect-ratio:16/9;background:#e4ebdf;display:grid;place-items:center;color:#6f7e70;overflow:hidden;font-size:16px} .hero img{width:100%;height:100%;object-fit:cover}
.detail{padding:22px} .detail h2{font-size:30px;margin:0 0 5px} .supply-title{font-size:14px;color:var(--muted);margin:14px 0 4px} .chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 14px} .chip{background:#eaf3e5;border:1px solid #d6e4d0;border-radius:999px;padding:7px 10px;font-size:14px;font-weight:700}
.section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px} .placeholder{color:#869288;font-style:italic}
.map-error{fill:#66756b;font-size:15px}.map-note{font-size:12px;color:#718078;margin:4px 4px 0}.map-part{transition:fill .15s,filter .15s,stroke-width .15s}
footer{padding:20px;text-align:center;color:#6e7a70;font-size:13px;line-height:1.7}
@media(max-width:900px){.layout{grid-template-columns:1fr} .mapcard{min-height:570px} #map{height:510px} .panel{height:auto;max-height:700px}}
@media(max-width:520px){header{padding:20px 16px 15px} .toolbar{padding:10px} .layout{padding:10px;gap:10px} .mapcard{padding:9px;min-height:500px} #map{height:445px} .county-label{font-size:10.5px;stroke-width:2.5px} .panel{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>合作社蔬菜農友互動地圖</h1>
  <p>把菜從哪裡來、由誰種、供應什麼，一張台灣行政區地圖看懂。滑鼠移到縣市可直接查看農友與供應品項；點縣市固定清單，再點農友看完整品項與介紹。</p>
</header>
<div class="toolbar">
  <input id="search" placeholder="搜尋農友、鄉鎮或蔬菜品項…" aria-label="搜尋農友、鄉鎮或蔬菜品項">
  <select id="countyFilter" aria-label="篩選縣市"><option value="">全部縣市</option></select>
  <button id="resetMap" type="button">回到全部</button>
</div>
<main class="layout">
  <section class="mapcard">
    <div class="map-head"><div><h2>台灣縣市行政區</h2><p>各縣市以不同顏色區分；半透明＝目前尚無農友資料。滑鼠移入或點擊縣市查看。</p></div></div>
    <div class="legend"><span><i class="dot has"></i>各縣市不同顏色</span><span><i class="dot none"></i>半透明＝尚無資料</span><span><i class="dot sel"></i>橘色＝目前選取</span></div><div id="mapMode" class="map-note">內建離線行政區互動圖</div>
    <svg id="map" role="img" aria-label="台灣縣市行政區互動地圖"></svg>
    <div id="tip" class="tip" aria-live="polite"></div>
  </section>
  <aside class="panel">
    <h2 id="panelTitle">全部農友</h2>
    <div class="meta" id="summary"></div>
    <div id="countySummary"></div>
    <div id="list"></div>
  </aside>
</main>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="close" id="close" type="button">✕ 關閉</button>
  <div id="drawerContent"></div>
</aside>
<footer>資料初版：2026/10/02 ｜ 地圖：各縣市不同色彩；浮動農友清單可滾輪瀏覽；連線可用時自動套用 Taiwan Atlas 行政區界</footer>
<script>
const CONFIG = {
  sheetCsvUrl: "",
  mapTopoUrl: "https://cdn.jsdelivr.net/npm/taiwan-atlas/counties-10t.json"
};
let farmers = [{"county":"新北市","town":"三芝","name":"謝金全","items":"瓜果類、山藥、豆薯","photo":"","intro":"謝金全為合作社最早期的合作農友，屬於早期與共同購買中心開啟合作的三芝有機蔬菜產銷班的成員之一","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台北/新北"},{"county":"新北市","town":"三芝","name":"楊如琳","items":"葉菜類、瓜果類、山藥","photo":"","intro":"楊如琳大哥為與合作社合作多年的資深農友，早期受合作社產品顧問鄭正勇與林碧霞兩位教授的指導，一起進行減硝酸鹽的耕作","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台北/新北"},{"county":"新北市","town":"三芝","name":"簡德源","items":"赤殼茭白筍、地瓜","photo":"","intro":"簡德源主要從事養蜂，為了讓蜂群有更好的環境，把家族留下的土地打造成無農藥的環境，並從事有機栽種，目前為慈心有機驗證。\n\n農場除了生產蜂蜜外，另有種植赤殼茭白筍、水稻與地瓜。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台北/新北"},{"county":"台北市","town":"北投","name":"陳心瑋","items":"瓜果類、葉菜類","photo":"","intro":"陳心瑋與一群有志從農的夥伴們皆曾在菜菜子教育農場一同學習與成長，後來有機會認識農場的地主想租地給合適的農友，也因開啟了從農共同耕作之路。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台北/新北"},{"county":"新北市","town":"五股","name":"吳泓泰","items":"觀音山綠竹筍","photo":"","intro":"吳泓泰原本在壽險業工作，後來選擇回到新北五股觀音山，與父親一同承接家族傳承五代的綠竹筍園。\n\n過去因仰賴菜市場販售，不僅需要大量人工，還常被殺價，收入有限。在深思後，他決定跳脫傳統銷售模式，轉型為無農藥、無化肥的友善耕作方式，讓產品與市場區隔，並透過網路及友善通路，將高品質的綠竹筍送到消費者手中。\n\n同時，他也建立完整的分級制度——頂級、優級、中級、生鮮去殼，以及加工品——讓田裡的每一支綠竹筍都能發揮價值，展現最好的風味與舞台。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台北/新北"},{"county":"新北市","town":"金山","name":"陳忠慶","items":"金山紅肉地瓜","photo":"","intro":"陳忠慶來自四代務農的地瓜世家，自小與土地結下深厚情感。原本在電子與金融業工作，因食品安全風暴與照顧長輩而返鄉。受到爺爺不用除草劑與農藥的影響，他堅持以有機方式栽種，取得慈心有機認證，並建立「陳家農舍」品牌，榮獲第五屆百大青農。\n\n金山特殊地理條件使地瓜特別香甜鬆軟。對於不符規格的NG品，他開發地瓜蛋黃酥、甘藷米餅等加工品，並推動食農教育與採收體驗，讓消費者更貼近產地與農業。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台北/新北"},{"county":"新北市","town":"金山","name":"台灣環境永續有限公司(謝永芳)","items":"金山黃肉地瓜、金山紅肉地瓜、金山栗子地瓜","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"台北/新北"},{"county":"宜蘭縣","town":"礁溪","name":"林漢祥","items":"溫泉空心菜","photo":"","intro":"林漢祥大哥原先是總鋪師，後來返鄉接手父親的產業，從事農業二十多年，現在礁溪鄉農會溫泉空心菜產銷班的班長。\n\n原本採慣行農法操作，後來為了消費者健康與友善土地環境，轉作有機，花費極大的耐心栽種，亦與礁溪鄉農會與花蓮農改場合作，逐步從失敗中吸取經驗，種植技術與產能慢慢漸入佳境","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"宜蘭"},{"county":"宜蘭縣","town":"南澳","name":"何仁興","items":"段木香菇","photo":"","intro":"何仁興，宜蘭南澳金洋部落泰雅族農友，自1972年退伍後便投入香菇栽培，五十多年來始終堅持以傳統段木方式種菇。他選擇海拔600公尺林蔭地，以原木鑽孔植菌，靠木頭養分、山泉水與雨水滋養，不施農藥，並以木屑鋪底取代防蟲網。\n\n栽培過程中，他傳承泰雅族「打香菇」的智慧，在雨季翻轉段木以促進生長；採收後則以柴火細燒烘乾，讓香菇保有濃厚木質香氣，風味遠勝電烤。2025年更榮獲宜蘭縣「原住民傑出農民」殊榮，不僅守護傳統技藝，也開創林下經濟新模式，讓南澳香菇兼具風味與文化價值。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"宜蘭"},{"county":"宜蘭縣","town":"南澳","name":"韋文吉","items":"山蘇","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"宜蘭"},{"county":"宜蘭縣","town":"員山","name":"蘭陽合作社","items":"赤殼茭白筍","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"宜蘭"},{"county":"宜蘭縣","town":"員山","name":"程超傑","items":"蓮藕","photo":"","intro":"程超傑從事有機耕作逾10年，以無農藥、無化肥方式栽種，並取得和諧有機驗證。自小隨父親管理高山水果，退伍後繼承果園，因九二一地震與水土保持議題放棄原本果園，回宜蘭重新開始。曾在蘭陽溪種西瓜有佳績，但因孩子就讀華德福小學接觸友善理念，毅然轉型有機耕作。雖初期不順，但逐漸上手，並發現自然生態能自我平衡，不必過度仰賴製劑。他樂於分享經驗，盼傳達尊重自然、愛惜土地的信念。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"宜蘭"},{"county":"宜蘭縣","town":"三星","name":"陳國鐘(行健農場)","items":"三星蔥、三星白蒜、紫芋地瓜、葉菜類","photo":"","intro":"陳國鐘大哥自幼在行健村成長，曾離鄉到台北工作，但最終還是選擇返鄉務農。回到宜蘭後種植稻米與蔥，朝多元化技術發展，後來因為行健村前村長張美推廣有機的理念，開始轉作有機。\n\n農場供應營養午餐，亦配合改良場作魚茭共生、魚芋共生等試驗。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"宜蘭"},{"county":"花蓮縣","town":"吉安","name":"陳柏叡","items":"龍鬚菜、佛手瓜、大花菜類、瓜果類、馬鈴薯","photo":"","intro":"陳文富大哥的農場位於花蓮縣吉安鄉，與合作社合作多年後交棒給兒子陳柏叡。柏叡原在宏達電擔任品管領班，現也回鄉耕作，並把自己機械的專業技術應用在農業上，更進一步建立自己專屬的有機育苗場","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"花蓮"},{"county":"花蓮縣","town":"壽豐","name":"李家豐","items":"食用百合","photo":"","intro":"李家豐，花蓮壽豐鄉農友，自小在田裡跟著父親務農，原本以慣行農法栽種。一次因噴藥中毒住院，讓他體會到農藥首先傷害的是農民自己，也危及消費者與環境，因而毅然投入有機農業。起初缺乏經驗，常遇到病蟲害與產量不穩，又曾因颱風導致設施全毀、作物損失，經濟一度陷入困境。但他憑著堅持，不斷調整耕作方式，強化設施，摸索出更好的防治模式，逐漸克服挑戰，收入與品質也隨之提升。如今不僅穩定供應各式有機蔬菜，更與花蓮改良場合作，建立有機食用百合的栽培模式，為在地有機農業開創更多可能。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"花蓮"},{"county":"花蓮縣","town":"壽豐","name":"黃偉哲","items":"毛豆","photo":"","intro":"黃偉哲1975年生於台南，高中畢業後懷抱解決糧食問題的理想，遠赴花蓮創立「山瑄璨有機農莊」(8.3公頃，慈心有機驗證)。\n\n初期以換工方式累積經驗，歷經病蟲害、資源不足仍堅持耕作，逐步發展出適應在地氣候的黃豆栽培技術，單位產量與品質均領先同儕。他強調「不是為了農法而農法」，結合有機精神與慣行精準管理，運用氮磷鉀配比及雜草高度控制，兼顧環境生態與產量穩定，以誠信與責任感推動台灣雜糧自給與永續。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"花蓮"},{"county":"桃園市","town":"復興","name":"彭康偉","items":"葉菜類、根莖類、瓜果類、生薑","photo":"","intro":"彭康偉大哥與合作社已合作多年，早期受合作社產品顧問鄭正勇與林碧霞兩位教授的指導，努力一段時間將田區改為作減硝酸鹽的耕作模式。為了讓菜趕快長而一直澆水，是病態。適當的停水，蔬菜的根才會扎得更深，植物的根就像人的腸子，腸子愈長，吸收到的微量元素和養分就愈豐富，這樣的菜才有香味和甜味。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"桃園"},{"county":"桃園市","town":"復興","name":"田嘉鈴","items":"葉菜類、包心白、甘藍、青蔥","photo":"","intro":"田嘉鈴與先生林士傑都是桃園復興鄉的泰雅族人，畢業於彰化明道大學農業精緻學系，多年來均以有機農法進行耕作，也取得環球有機驗證","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"桃園"},{"county":"桃園市","town":"新屋","name":"葉筱梅","items":"葉菜類","photo":"","intro":"姜慧娟、葉筱梅母女檔，藉有機種植，觀己是否順天應理，是否與大自然完全融入，共生共養。\n\n姜慧娟因健康因素開始改食用有機蔬菜，但市售施用很多肥料種植的有機蔬菜對對自己的身體不僅沒有幫助，甚至讓身體變差，故此開啟投入減硝酸鹽的有機蔬菜生產。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"桃園"},{"county":"桃園市","town":"八德","name":"綠藤芽菜","items":"三日苗、青花椰苗、紫高麗苗","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"桃園"},{"county":"桃園市","town":"大溪","name":"新峰芽菜","items":"黃豆芽、綠豆芽、苜蓿芽、豌豆苗","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"桃園"},{"county":"新竹縣","town":"尖石","name":"羅彌迦","items":"甘藍、白蘿蔔","photo":"","intro":"羅彌迦原任聯結車司機，因車禍返鄉投入自然農法，堅持無農藥、無化肥栽培，以中藥材釀製漢方酵素與微生物菌改良土壤、防治病蟲，讓蔬果與土地共生。\n\n他與主婦聯盟合作社長期穩定合作，解決產銷困難，並帶動族人投入有機，被部落敬稱為「頭目」。羅彌迦以穩定品質與經驗分享，推動尖石鄉的有機轉型，守護族人健康，也讓土地恢復生機。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"羅深恩","items":"葉菜類、甘藍、包心白、包心芥、白蘿蔔、瓜果類、花椰菜、青蔥、青蒜","photo":"","intro":"農友羅深恩是羅彌迦的大兒子。自幼在家協助農事，後與父親共同耕作，從事農業將近十多年\n\n因農友已成家多年，目前獨立出來，成立厚恩農場，為合作社新生代的合作農友","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"江文平","items":"葉菜類、甘藍、包心白、包心芥、白蘿蔔、瓜果類、花椰菜、青蔥、青蒜","photo":"","intro":"農友江文平一家為新竹尖石鄉抬耀部落的泰雅族人，以務農為主業。文平早期隨羅彌迦大哥一同耕作，亦累積多年的耕作經驗。\n\n羅彌迦大哥為合作社早期配合減硝酸鹽耕作的農友，文平長期與彌迦大哥共耕，亦配合本社的環境友善的耕作理念，目前也是合作社主力的合作農友。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"沈世偉","items":"葉菜類、瓜果類、青蔥、青蒜","photo":"","intro":"沈世偉是羅慶郎（羅彌迦的父親）的女婿，原是南投的原住民，在擔任士官長退伍，原本父親希望農友會家幫忙種田，但因是種慣行農業，因自己不喜歡用農藥，就選擇去幫忙岳父的農場。\n\n本來想用自己的方式種，但發現都種不起來，還是學習用岳父的種植方式。會使用黃柏、紅豆杉製成的漢方酵素，種植時一週噴兩次至三次，對介殼蟲，蚜蟲有效，","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"林柏清","items":"葉菜類、甘藍、包心白、包心芥、白蘿蔔","photo":"","intro":"林新民也將有機栽種的理念與經驗傳承給兒子們。\n\n長子林柏清，高中畢業後便投入農業，退伍後決定留在山上務農，後來獨立經營農場，延續父親理念，持續與合作社合作。\n\n三子林柏如，服役返鄉後跟隨父親學習，逐步引入有機肥與現代技術","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"林柏如","items":"葉菜類、甘藍、包心白、包心芥、白蘿蔔","photo":"","intro":"林新民也將有機栽種的理念與經驗傳承給兒子們。\n\n長子林柏清，高中畢業後便投入農業，退伍後決定留在山上務農，後來獨立經營農場，延續父親理念，持續與合作社合作。\n\n三子林柏如，服役返鄉後跟隨父親學習，逐步引入有機肥與現代技術","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"林程詳","items":"葉菜類、甘藍、包心白、青蔥","photo":"","intro":"林程詳與林約翰父子檔亦是與合作社配合多年的原住民農友，堅持以有機栽種。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"新竹縣","town":"尖石","name":"林約翰","items":"葉菜類、甘藍、包心白、青蔥","photo":"","intro":"林程詳與林約翰父子檔亦是與合作社配合多年的原住民農友，堅持以有機栽種。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"新竹"},{"county":"苗栗縣","town":"三義","name":"張壬菩","items":"瓜果類、地瓜","photo":"","intro":"張壬菩是苗栗三義「笠園有機農場」的第二代經營者，自小在農場長大，熟悉農事與導覽。大學畢業後返鄉，投入農場經營與網路行銷，承襲父親張恒賓友善耕作的理念。\n\n張恒賓原為電工背景，創立笠園並與主婦聯盟合作十餘年，長期穩定供應有機番茄等作物。張壬菩導入數位行銷、食農體驗與客製化蔬菜箱，拓展至台中后里經營有機專區，展現農業創新與世代傳承的力量。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"苗栗"},{"county":"苗栗縣","town":"卓蘭、東勢","name":"范玉芳","items":"小黑栗子南瓜","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"苗栗"},{"county":"苗栗縣","town":"獅潭","name":"百壽芽菜","items":"黃豆芽、綠豆芽、苜蓿芽、豌豆苗","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"苗栗"},{"county":"台中市","town":"和平","name":"羅伊秀","items":"新鮮香菇","photo":"","intro":"羅伊秀畢業於雲林科技大學工業管理系，父母為香菇農。大學時期便開始在校園販售自家香菇，實踐「會種，也要會賣」的理念。\n\n畢業後返鄉創立「菇媽媽」品牌，從包裝設計到直銷推廣，為傳統香菇注入年輕創意。雖然務農辛苦，但她更珍惜農作帶來的踏實與快樂，也憑藉創新經營獲選農委會第一屆「百大青農」，成為青農代表之一。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台中"},{"county":"台中市","town":"新社","name":"陳耀松(青松)","items":"新鮮香菇、乾香菇","photo":"","intro":"臺中新社「天下第一菇」的陳耀松，早年以種植香菇為主，受到中國大陸低價走私香菇衝擊，於2001年轉作杏鮑菇。初期因技術不成熟，連續兩年虧損，加上廠房歷經三次火災，經營之路充滿挑戰。但陳大哥沒有放棄，在農業試驗所輔導下，逐步改善設備與栽培技術，建立從生產到行銷的一條龍經營模式，成為當時臺灣規模最大的杏鮑菇生產者。\n\n除了杏鮑菇，陳大哥多年來也持續協助尋找合適的農友栽培新鮮香菇，串聯生產與市場需求。隨著人工與生產成本不斷攀升，他最終選擇結束杏鮑菇生產，但原有的香菇供應並未因此中斷。如今，陳大哥仍運用多年累積的產業經驗與人脈，持續協助媒合農友供應香菇。雖然不再親自種菇，卻依然是連結農友與消費者的重要橋梁，讓多年累積的菇類情緣，以另一種方式延續下去。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台中"},{"county":"台中市","town":"新社","name":"就是鮮菇有限公司","items":"新鮮香菇、黑木耳、川耳、有機綜合菇、有機銀耳、有機乾姬松茸","photo":"","intro":"湯如禎與丈夫原經營自家的香菇寮，丈夫長年在香菇製包廠的第一線工作，因長期負責拌料，接觸農藥，偶然發現肝癌末期，一年內即過世，在此之後農友即下定決心，轉型作有機栽種，目前由兒子負責香菇栽種，湯如禎負責業務銷售。\n\n除了供應自家新鮮香菇外，農友亦設置農產初級加工室與小型包裝理貨廠。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台中"},{"county":"台中市","town":"烏日","name":"張東賢","items":"小黃瓜、甜椒","photo":"","intro":"為陪伴孩子成長，張東賢與太太彭蘇蓉放棄年薪百萬的工作，也因太太一句話：「你應該把時間花在你最喜歡的人身上」，希望找一件兩人可以一起做的事，因緣際會下開始了拿鋤頭的日子。\n\n張東賢於精密溫室，以介質(泥炭苔)代替土壤，無農藥方式防治病蟲害。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台中"},{"county":"台中市","town":"大安","name":"林義職","items":"芋頭","photo":"","intro":"林義職主業為東海大學的工友，另有作孩童的運動教學課程，從農為兼職。因懷念小時候喜歡芋頭的味道，亦想實踐全程無農藥、無化學肥料的理念，二○○七年決定先承租休耕十多年的兩分農地開始種植，其中付出了許多高昂的學費後，終於掌握了種植的技巧。\n\n因著農友的努力得到父親的肯定，最終農友的父親將自己的田讓農友作有機芋頭的規畫生產。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台中"},{"county":"台中市","town":"石岡、苑裡","name":"隆谷","items":"金針菇、柳松菇、鴻喜菇、新鮮白木耳","photo":"","intro":"農友莊文豐(隆谷養菌場)，民國67年隨父於台中石岡區開墾整地，以栽種段木香菇為主。洽逢民國74年保護森林資源的政策，開始嚴禁段木的採伐，當時大陸乾燥香菇走私漸趨猖獗，面臨菇類菌種產業的危機。\n\n偶然的機緣下鑽研日本的「柳松菇」，民國79年栽植成，往後陸續研發杏鮑菇、金針菇、鴻喜菇、新鮮白木耳等品項。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台中"},{"county":"彰化縣","town":"埔鹽","name":"陳慶輝","items":"花椰菜、瓜果類、小番茄、洋香瓜、美濃瓜","photo":"","intro":"陳慶輝是與合作社配合10年以上的農友，以前學的是電工，也做過行銷，20多年前因緣際會認識有機農業便棄工從農，回老家接手埔鹽的田地，開始從農生活。\n\n他除了致力友善農業生產外，也喜愛嘗試、鑽研農業新型機具與技術，甚至研發出改良穴盤快速播種機、快速滴水帶捲收器，提高生產效率，降低灌溉水使用及施肥量，也降低生產成本，總是積極進修農業知識且勇於接受挑戰。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"彰化"},{"county":"彰化縣","town":"溪湖","name":"曹素珍","items":"花椰菜、葉菜類、瓜果類、小番茄、韭菜花、青蔥","photo":"","intro":"曹素珍原為幼教老師，後跟隨先生陳世勳踏入農業的栽種。早期陳世勳年輕時在外工作，直到三十四歲才返鄉，因不喜歡種植時噴灑農藥也為了身體健康安全後轉作有機農業。\n\n初期技術不足，賠了很多錢，但後來漸入佳境，供應多樣化的蔬果，也成為主婦聯盟的主力農友之一。2021年陳世勳因病過世，後續由曹素珍繼續從事耕作。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"彰化"},{"county":"彰化縣","town":"埔心","name":"蕈優","items":"黑美人菇、陶立克菇、杏鮑菇","photo":"","intro":"方世文原為電子工程專業，毅然放棄高薪投入蕈菇農業，為突破傳統栽培用藥限制，走訪國外並研發「全程無塵」科技農法，在環控條件下培育出無需用藥的高營養菇類。同時，他也創立「魔菇部落」生態休閒農場，結合親子旅遊與食農教育，讓大眾在遊玩中認識菇類之美。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"彰化"},{"county":"彰化縣","town":"埤頭","name":"張未","items":"花椰菜、葉菜類、瓜果類、青蔥","photo":"","intro":"彰化埤頭農友鄭源卿，自1990年代投入有機農業，堅信「農業不只是賺錢，更要對土地負責」。自1999年起供應主婦聯盟合作社，以用心栽培的蔬菜累積深厚信任。\n\n一場大病，讓原本無意務農的兒子鄭文苑，因心疼父母的辛勞、不捨父親的心血而返鄉。鄭源卿辭世後，妻子張未與兒子攜手接棒，由張未統籌生產與供應，鄭文苑運用機械專長精進栽培管理，持續供應葉菜、青白花椰及瓜果類蔬菜。父親雖已離開，但他對土地的愛與堅持，仍在母子倆的雙手中延續，化為守護社員餐桌的安心承諾。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"彰化"},{"county":"彰化縣","town":"和美","name":"彰化縣菇類生產合作社","items":"金滑菇","photo":"","intro":"彰化縣菇類生產合作社成立於民國88年，由早期洋菇、草菇罐頭供應逐步發展至多元生鮮菇類栽培與推廣，包括金針菇、香菇、秀珍菇、平菇、木耳、杏鮑菇等十餘品項。\n\n合作社現有社員42人、配合農場逾百場，並統籌9個產銷班，具備冷藏運輸車16部，由萬生集貨場統一規劃生產與行銷，產品銷售遍及全台各大市場、量販超市、學校營養午餐，並拓展外銷。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"彰化"},{"county":"南投縣","town":"埔里","name":"陳守安","items":"茭白筍","photo":"","intro":"1978年生的陳守安，與妻子畢業於南臺科技大學，曾在桃園資訊業工作。因食安事件與陪伴孩子的需求，2013年舉家返鄉埔里，接手父親的茭白筍田，以「埔里陳老爹」品牌展開新生活。他從減藥起步，逐步轉為無農藥、無化肥栽培，並導入浮萍淨水、誘蟲盒防治與生物炭改良土壤，堅持友善耕作。\n\n多年來持續供應主婦聯盟合作社，以無泡水處理的鮮筍，保留自然甜味與安心品質。農閒時投入社區食農教育，帶學生下田體驗，守護土地與食物安全。正如其名「守安」，他以行動守護下一代，成為合作社重要的茭白筍農友。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"埔里","name":"洪權宏","items":"茭白筍","photo":"","intro":"洪權宏是主婦聯盟合作社長期的重要農友，穩定供應優質有機茭白筍。他不僅自身堅持友善耕作，也積極引薦專家協助合作社農友，例如推動陳守安走上無農藥栽培之路。\n\n洪權宏自民國85年開始栽培茭白，93年起毅然轉向有機農法，歷經產量驟降與外界質疑，仍堅持透過土壤改良與生態防治提升品質，將單位產量從每分地1,000公斤提升至2,400公斤以上，成為埔里有機茭白筍的示範典範。\n\n101年更發起「台灣之心–大埔里有機聯盟」，帶動在地農友共同推廣有機，為埔里「有機小鎮」願景奠下基礎。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"名間","name":"謝樹篤","items":"人蔘山藥","photo":"","intro":"謝樹篤過去以種茶為主，後來轉有機栽培後栽種其他作物，至今有20多年的經驗，目前為慈心有機驗證。種植講究生態環境的維護，田裡會保留皇蛾的食草江某樹與甲蟲的食草光臘樹。不過量施肥，施用有機肥料，並自製鳳梨皮、黑糖做成的酵素作施用。\n\n因名間田區常常缺水，地下水比自來水還要貴，故自家田區附近有挖蓄水池，可在定植初期時可少量供水，也栽種較為耐旱的作物，如山藥、鳳梨、薑黃、生薑等，在生長期只能靠天然雨水供應。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"名間","name":"名間產銷班","items":"秀珍菇、白精靈菇、雪白菇","photo":"","intro":"2011年同時成立南投縣名間鄉菇菌類生產合作社，實際仍以產銷班運作為主。\n\n早期主要從事蔬菜、菇菌類的栽種與銷售，至今衍變為與全省菇農契作新鮮菇類，再供貨給其他通路販售。\n\n產銷班成立的有機分裝廠，可將採購的原料包成小包裝。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"名間","name":"陳宏白","items":"竹薑","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"吳阿香","items":"佛手瓜、瓜果類","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"吳坤錦","items":"葉菜類、瓜果類","photo":"","intro":"吳坤錦（布農族名 Madivaiyan），來自南投仁愛鄉萬豐村曲冰部落。早年為了撫養八個孩子，在台北承攬水土保持工程，曾負責德基水庫沿線植生作業。1993年在廖金池號召下，他毅然返鄉投入有機農業，與七戶農友組成產銷班。當時九成人觀望，他卻堅信要讓土地恢復健康，靠「微生物養大的菜」翻轉部落。多年來，他不僅改良益菌堆肥增收五成，更以經驗判斷葉菜硝酸鹽，供應合作社近三十年，被稱為部落有機堅持者與典範。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"余登貴","items":"芭蕉","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"楊春發","items":"葉菜類、瓜果類、生薑、青梅","photo":"","intro":"楊春發自小在祖傳梅園長大，延續父輩愛惜土地的精神，以天然管理守護六十年梅樹。返鄉後積極投入萬豐有機產銷班，推動部落轉型，並與農改場合作成為夏季蔬菜示範農友，將結球白菜與番茄技術提升。楊春發相信「種出安心，收成信任」，農場產品多年供應主婦聯盟，見證了曲冰部落走向有機聚落的歷程。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"陳明德","items":"葉菜類、瓜果類、生薑","photo":"","intro":"陳明德，南投仁愛鄉萬豐村農友，取「五金有機農場」之名，因為家中有五個心愛的女兒。年輕時為養家，他遠赴台中當怪手司機，只能在領薪時返家團聚。2013年，他帶著「回家」的念頭回到部落，把荒廢長滿芒草的祖田開墾成有機農場。面對貸款壓力與病蟲害，他與妻子劉麗筠一邊打工一邊拔草，堅持不打藥，用菸葉、辣椒、醋自製驅蟲水。2016年加入主婦聯盟正式供應，他笑說：「看到社員安心吃菜，就是最好的回報。」","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"吳聰明","items":"葉菜類、瓜果類","photo":"","intro":"吳聰明從小成長在務農的家庭，父母以水稻、玉米、小米、地瓜為主，成家以後外了家計去外地作板模工，待孩子長大後才又回到部落生活。\n\n回部落後就以務農為生，起初是採慣行栽培，但後來發現自己對農藥過敏，恰巧認識廖金池並加入其有機班，後續就改為無農藥、無化肥栽培。農友除了考量自己的健康，也為了維護良好的環境與永續經營，並將優質蔬菜與更多的社員分享。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"南投縣","town":"仁愛","name":"林瓊珠","items":"甜柿、牛番茄","photo":"","intro":"林瓊珠和先生潘源田的耕地位在南投縣仁愛鄉海拔 1300 公尺處的春陽村與瑞岩部落的發祥村，原本家中是開農機行，因擔心工作中吸入太多廢氣，於是轉換跑道至農業生產領域。\n\n因看到了農藥在農友朋友身上留下的傷害，因此決定一家人走上有機耕作的道路，堅持不使用化肥、農藥，以勤勞巡園修剪病株，替果實套袋來防護蟲咬。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"南投"},{"county":"雲林縣","town":"西螺","name":"廖俊凱","items":"葉菜類、根莖類、瓜果類","photo":"","intro":"廖俊凱，土生土長的西螺人，早年因目睹農村困境，立志改善農民生活。他退伍後先在超市、果菜公司與大賣場工作，觀察農業銷售環節，後來受台大學者演講啟發，毅然投入有機農業。二十多年來，他不僅研發火焰除草法、推廣原生蔬菜，更創立農業師徒制，指導年輕人投入友善耕作。妻子與母親一同參與農場，成為家族共同經營的典範，他也因此被稱為「蔬菜博士」，深受合作社與農業界肯定。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"虎尾","name":"張朝陽","items":"葉菜類、根莖類、瓜果類、豆類","photo":"","intro":"張朝陽年輕時因長期接觸農藥，身體一度出現狀況，讓他開始反思務農方式。轉作有機後，他先試著自己吃，發現精神與健康逐漸改善，才真正下定決心走有機路。他和太太沈素珠常天未亮就下田，四塊農地輪耕，為了控草害還自己研發簡易除草工具。鄰居笑他「賣命種草」，但他卻說：「這是為了家人的健康，也是為了消費者的安心。」如今，他把這份經驗和信念，一起送到每個社員的餐桌上。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"斗南","name":"蘇榮","items":"人蔘山藥、馬鈴薯、瓜果類","photo":"images/蘇榮.jpg","intro":"蘇榮自小在雲林長大，對土地懷有深厚感情。大學畢業後，他選擇回鄉接手紅磘農場，從傳統農法轉型到有機栽培，歷經挑戰卻始終堅持「讓土地休息、讓人安心」。他以稻米、山藥與馬鈴薯間作，結合人工除草與輪作養地，逐步建立多樣化耕作模式。蘇榮每週親赴中興大學農夫市集，與消費者分享耕作心得，因真誠踏實而贏得信任，也獲得「神農獎」肯定，展現農人守護土地的初心。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"斗南","name":"鉅檂農業科技有限公司","items":"蒜仁","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"斗六","name":"王文傑","items":"金時地瓜","photo":"images/王文傑.jpg","intro":"王文傑，本業是鞋樣設計工程師，卻因從小在農村長大，對土地懷抱深厚情感，選擇在工作之餘投入友善有機耕作。他創立「天然養生地瓜園農場」，並積極進修雲科大有機農業專班與虎尾科大農業經理人專班，補足專業知識，也取得采園有機驗證。為了讓地瓜品質更佳，他實踐水旱輪作，並因碾製有機稻米結識農友蘇榮，開啟合作契機","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"大埤","name":"李新護","items":"蒜頭(減農藥栽培)","photo":"","intro":"李新護從小看著父母在田裡揮汗，心裡早已種下對土地的情感。雖然本業是機械，但在耕作蒜頭的13年間，他一次次面對失敗——乾燥後只剩外皮、雨季延誤導致爆瓣——卻始終不放棄。因受農友蘇榮有機理念啟發，他逐漸轉向減農藥栽培，將農藥用量減至三分之一，並輔以皂素、苦楝油等天然資材，也減少除草劑的使用。這份堅持，不只是追求產量，更是實踐對土地與健康的承諾。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"土庫","name":"張秋田","items":"蒜頭(減農藥栽培)","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"土庫","name":"王水聲","items":"馬鈴薯、甜菜根、玉米筍、花生","photo":"images/王水聲.png","intro":"王水聲大哥在雲林土庫的田裡，用最自然的方式與土地相處。他早年種蘆筍，後來轉向輪作花生、馬鈴薯與紅鬚玉米筍，讓土壤能夠休養生息。為了讓消費者吃得安心，他在2018年取得有機驗證，堅持不用化學藥劑，以日曬乾燥保留花生的純粹香氣。每一株馬鈴薯、每一支玉米筍，都是他在烈日與晨霧間細心照料的成果，也承載著他守護土地、實踐永續農業的初心。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"口湖","name":"郭明源","items":"地瓜","photo":"images/郭明源.jpeg","intro":"郭明源與施麗芬夫婦居住於於雲林縣口湖鄉，成龍溼地附近，家族原先從事板模業，直到父親買了一塊地，但因土地鹽化無人願意承租故自行投入農業，開啟了從農之路\n\n秉著單純不想聞到農藥味道的想法，起初耕作已堅持不用農藥與化肥。目前耕作面積約3.5公頃，分布在成龍、水林等區，目前全區取得和諧有機驗証","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"水林","name":"楊翔喻","items":"洋菇","photo":"images/楊翔喻.jpeg","intro":"楊翔喻原本養鵝，卻因飼料成本高漲毅然轉行，投入陌生的洋菇栽培。他花三年把稻田改建成菇場，日夜守在發酵室，靠著「聞起來不會臭」判斷發酵是否成功。太太鄭美華放下珠寶業與他並肩打拚，大兒子更自學研發遠端監控系統，減輕父母勞累。從零開始到全台唯一有機洋菇專業農場，楊翔喻用堅持與創新，證明土地能回饋安全、潔淨的食材。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"水林","name":"林福源","items":"地瓜","photo":"images/林福源.jpeg","intro":"農友原先從事營造業，退休後繼承了家族的耕地，剛開始以用藥用化肥的方式種了四年的水稻與花生，後來因緣際會開始參加慈心舉辦的課程，課程中也逐漸認同有機的栽種理念，故決定改以無農藥無化肥操作，並在田區周遭設立人工生態池來復育青蛙，後續亦申請綠保驗証。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"草嶺","name":"吳霖蘿","items":"段木香菇","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"雲林"},{"county":"雲林縣","town":"東勢","name":"潘穎儒","items":"日本白蘿蔔、瓜果類、蒜頭、蒜米","photo":"images/潘穎儒.jpeg","intro":"潘穎儒原本從事美工設計與進口貿易，因看見有機市場需求，毅然辭職返鄉，協助父母耕作，並在農田裡與現任先生黃士珈相識。她承襲父母「無農藥、無化肥」的理念，深知父親因見農友農藥中毒早逝而立志守護土地與人健康，如今夫妻攜手在雲林東勢與台西耕作，盼將最安心的蔬果獻給社員。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"雲林"},{"county":"嘉義縣市","town":"義竹","name":"翁錦煌","items":"葉菜類、瓜果類、地瓜、紅蘿蔔、洋香瓜、小西瓜","photo":"","intro":"翁錦煌自1995年開始投入有機耕作，起因是姑姑三度勸說，並承諾幫他銷售，才讓他有勇氣邁出第一步。初期因多樣化嘗試，田間病蟲害四起，還被笑說「連蚜蟲都五顏六色」。但他憑著不服輸的韌性逐漸闖出名聲，銷路甚至遍及全台。如今他不僅持續供應合作社，更投入農電共生，讓鮮綠農場在土地、環境與理念間找到平衡，見證台灣有機農業發展的歷程。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"嘉義"},{"county":"嘉義縣市","town":"竹崎","name":"王俊童","items":"生薑(減農藥栽培)","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"嘉義"},{"county":"嘉義縣市","town":"嘉義市","name":"李長安","items":"甜筍","photo":"","intro":"李長安自小因農藥氣味而立志走向無毒耕作，三十年來始終如一。他在嘉義建立長安有機農場，分布不同海拔的田區，既有溫室也有露地。農場全家總動員，兒子李國維專注田間，女兒李鳳如負責包裝與出貨，形成最堅強的團隊。李大哥不只務農，也常在茶香間分享「道法自然」的人生智慧，並受邀至中正大學授課，成為嘉義推廣有機農業的典範人物。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"嘉義"},{"county":"嘉義縣市","town":"東石","name":"看天田有機農場","items":"玉米類、玉米筍、紅蘿蔔、洋蔥、紅蔥頭","photo":"","intro":"同樣是高雄神采飛揚KTV老闆的郭明賢，為讓一歲孫女吃到安心蛋糕，追食材追到田裡，乾脆在嘉義鰲鼓濕地租下23甲「看天田」。他不噴藥、不施化肥，帶著二三十歲青農輪作雜糧，讓候鳥與作物同住。颱風與蟲害來了也不退，把格外品變成米穀粉蛋糕與紅蘿蔔點心，將愛化成友善土地的日常。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"嘉義"},{"county":"嘉義縣市","town":"六腳","name":"謝水明","items":"彩椒、小黃瓜","photo":"","intro":"謝水明原本以慣行農法耕作，卻因長期吸入農藥，夫妻倆肝指數偏高，健康拉起警訊。於是轉向有機資材與低用藥管理，十多年堅持友善栽培，不僅讓土地更健康，自己的身體也逐步恢復。特別選擇挑戰高難度的有機彩椒，投入大量心力研究，並與農試所合作天敵防治，結合滴灌技術與自製微生物液肥，打造安心又珍貴的農產品。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"嘉義"},{"county":"嘉義縣市","town":"中埔","name":"彥廷農場","items":"新鮮黑木耳","photo":"","intro":"陳鏘謙自小在菇寮長大，原本立志不種菇，卻在創業受挫後回到家業。921地震摧毀菇寮，他憑機械背景與遠見，貸款重建全台首座環控無農藥木耳寮，外界都說「穩死的」，連父親也兩年未踏入。直到第一批巨大肥厚的黑木耳收成，父親驚嘆「這輩子沒看過這麼漂亮的木耳」，這份肯定成為他持續創新的力量，如今彥廷農場已成台灣黑木耳產業的標竿。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"嘉義"},{"county":"台南市","town":"新市、新化","name":"王宗益","items":"葉菜類、大花菜類、包心菜類、根莖類、瓜果類","photo":"","intro":"王宗益，臺南新市與新化的有機農友，因不滿慣行農法，毅然走上友善耕作之路。他推廣赤道櫻草等耐熱野菜，並自創「穴盤種植」模式，減輕田間作業辛勞，曾讓身障者與街友也能參與農作，展現農業的社會關懷。\n\n為守護土地，他採用生物防治取代化學藥劑，並與學校合作推動食農教育，帶孩子們體驗田間採摘與生態共生。他的故事不僅是農業創新，更是對土地、人群與未來的深情守護。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"新化","name":"樓正福","items":"葉菜類、瓜果類","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"新化","name":"羅云堅","items":"瓜果類、根莖類","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"安南","name":"楊湘頻","items":"葉菜類","photo":"","intro":"楊湘頻的父親楊定國原為民意代表，曾擔任台南市議員，原就嚮往退休後的農業生活。離開民意代表的工作後，曾經開過餐廳，自2008年開始投入小葉菜的種植。楊湘頻自大學畢業後，就加入父親的小葉菜生產行列。因農友郭明賢引薦，想以高品質的產品供應給合作社，以敬天惜地友善環境，三生有幸(生活、生態、生產)的理念生產，也取得成大有機認証","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"善化","name":"洪淑珍","items":"甜椒、玉米","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"西港","name":"謝素凉","items":"綠蘆筍","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"玉井","name":"陳明宏","items":"絲瓜、麻糬茄、皇帝豆、粉豆","photo":"","intro":"陳明宏原本在金融業工作，因想讓孩子體驗自己童年的自然生活，於2006年毅然返鄉接手牛頭山荒廢的果園。初期屢遭颱風與蟲害打擊，但他選擇堅持有機耕作，透過保留雜草吸引天敵，逐步建立類自然生態平衡。他也參加當地國小的食農教育，讓牛頭山農場成為臺南有機農業的典範，實踐生產者與消費者共好的理念。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"玉井","name":"許悦玲","items":"敏豆、南瓜、茄子","photo":"","intro":"","story":"","article":"","status":"待補照片/介紹","updated":"2026-10-15","source":"台南"},{"county":"台南市","town":"白河","name":"楊家銘","items":"新鮮蓮子、蓮藕","photo":"","intro":"楊家銘，台南白河七年級青農，退伍後投入蓮花產業，與妻子謝汶樺共同經營「藕達人」品牌，採無毒栽培並積極投資冷藏、洗藕設備，提升產業競爭力。\n\n面對勞動力不足與加工成本高漲，他選擇以創新與品牌化突破困境，並推廣帶膜帶芯蓮子，呼籲消費者支持在地農友，共同守護台灣少數仍持續耕耘的蓮花產業。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"台南"},{"county":"高雄市","town":"大樹","name":"張立坤","items":"瓜果類","photo":"images/張立坤.jpeg","intro":"張立坤，78年次，高雄大樹第四代農家，嘉義大學生技系畢業後返鄉務農，延續父親張肇基逾二十年的有機耕作基礎。\n\n自2012年起投入農務，2016年首次獨立管理田區，挑戰苦瓜種植並累積病害防治經驗。2017年以自己名義交貨給合作社，全面規劃生產、採收與報菜，並積極引入天然資材創新管理。\n\n張立坤展現第二代農友承繼與創新並行的特色，為主婦聯盟計畫性生產注入新能量。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"高雄"},{"county":"高雄市","town":"田寮","name":"朱明發","items":"甘藍、漳浦包白、瓜果類","photo":"images/朱明發.jpeg","intro":"朱明發，高雄田寮人，臺大歷史系畢業後曾參與社運，三十多歲時決定返鄉務農，創立「月照農場」。最初父母難以理解他放棄都市生活，但多年來他以無化學農法結合微生物技術，逐步讓惡地化作沃土，贏得家人的肯定。\n\n農場以低度干預為核心理念，強調讓作物依循自然生長，維持土地生態平衡。自2014年起與主婦聯盟合作逾十年，透過定期產地拜訪與技術交流，建立深厚互信關係，他也以「視農如友」自許，展現對家鄉土地的深情與對友善農業的堅持。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"高雄"},{"county":"高雄市","town":"旗山","name":"黃啟軒","items":"水蓮","photo":"images/黃啟軒.jpeg","intro":"黃啟軒原任職營造業，後因健康與生活考量返鄉投入水蓮栽培。當地水質清澈、氣候穩定，讓他能在20公頃水塘建立全台最大規模水蓮園區，年產350–400公噸。2019年起轉型有機，取得中興大學驗證，並導入無人機管理、鴕鳥羽毛發酵肥，兼顧效率與永續。田間保留烏龜、水鴨、紅冠水雞棲息，營造自然共生生態，也讓他的平價有機水蓮走向超市與外銷市場，成為綠金產業代表。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"高雄"},{"county":"屏東縣","town":"鹽埔","name":"鄭英文","items":"漳浦包白、瓜果類、青蔥、芫荽","photo":"images/鄭英文.jpg","intro":"鄭英文早年就投入合作社蔬菜供應，以友善土地、重視品質為原則，深受肯定。他的兩個兒子鄭天貴與鄭玉榮自小在田間幫忙，從耕作、灌溉到收成皆參與其中，不僅累積了豐富的實作經驗，也養成對農業的責任感與熱情。三人攜手投入合作社，延續家族傳統，並以實際行動守護環境，展現世代傳承與農村永續的力量。","story":"","article":"","status":"資料完整","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"鹽埔","name":"鄭天貴","items":"瓜果類、青蔥","photo":"","intro":"鄭英文早年就投入合作社蔬菜供應，以友善土地、重視品質為原則，深受肯定。他的兩個兒子鄭天貴與鄭玉榮自小在田間幫忙，從耕作、灌溉到收成皆參與其中，不僅累積了豐富的實作經驗，也養成對農業的責任感與熱情。三人攜手投入合作社，延續家族傳統，並以實際行動守護環境，展現世代傳承與農村永續的力量。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"鹽埔","name":"鄭玉榮","items":"漳浦包白、瓜果類、青蔥、芫荽","photo":"","intro":"鄭英文早年就投入合作社蔬菜供應，以友善土地、重視品質為原則，深受肯定。他的兩個兒子鄭天貴與鄭玉榮自小在田間幫忙，從耕作、灌溉到收成皆參與其中，不僅累積了豐富的實作經驗，也養成對農業的責任感與熱情。三人攜手投入合作社，延續家族傳統，並以實際行動守護環境，展現世代傳承與農村永續的力量。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"潮洲","name":"永豐農場","items":"紫高芽、青花芽、四合一芽苗、綠豆芽、黃豆芽","photo":"","intro":"郭連豐為永豐農場創辦人，早年以苜蓿芽起家，因堅持「讓人吃得健康，土地也能永續」轉入有機栽培，至今超過二十年。\n\n農場為全台首家取得國內外有機雙驗證的芽菜生產者，從源頭種子到栽培全程不用化肥農藥，採環控管理確保品質。持續以專業與初心守護消費者健康。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"長治","name":"田中央合作社","items":"小黃瓜、葉菜類、彩色小番茄","photo":"","intro":"蘇鵬是屏東「中央畜牧場」場主，從事養豬超過40年，憑藉綠能環保養豬榮獲神農獎。他首創豬糞尿沼氣發電與乾濕分離技術，將廢水與沼泥循環利用於有機小黃瓜與洋香瓜的溫室栽培，每日穩定供應約500公斤，銷往校園團膳與有機通路。\n\n蘇鵬以養豬規格投入蔬果管理，展現高標準品管，並推動產學合作與循環農業，成為畜牧與農業共生的典範。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"恆春","name":"尤憲德","items":"洋蔥","photo":"","intro":"尤憲德，退役軍人返鄉承接家族農地，2003年毅然全面轉作有機，創立「欣洋有機農場」，成為台灣第一位有機洋蔥栽培農友。\n\n他善用恆春落山風與乾燥氣候優勢，施用有機肥及輪作方式，讓洋蔥球莖緊實香甜、皮薄耐存。早期因資材不足曾與病蟲害奮戰，但憑著堅持逐步克服難關，成為在地有機農業的代表人物。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"屏東市","name":"伯大尼","items":"青蔥","photo":"","intro":"屏東伯大尼之家由身心障礙院生組成農友團隊，在專業老師陪伴下從事蔬果栽培與畜牧，並飼養牛羊豬。透過拔草、撒種、灌溉與飼養動物，讓院生同時進行肢體訓練與心靈療癒，培養責任感與成就感。這片田園不僅是農場，更是復健與生命尊嚴重建的場域，實踐友善耕作與社區連結的價值。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"屏東市","name":"陳建行","items":"牛蒡","photo":"","intro":"陳建行屏科大環境科學碩士畢業，現任屏東市農會蔬菜產銷班13班班長。陳大哥早年任職於股票上市公司生管，返鄉後推動「柳川黑牛蒡」產業升級，申請有機與產銷履歷驗証，並創立「大力蔘」品牌，並於2013年榮獲十大神農獎。因重視品質，他不僅改良田間管理，更研發牛蒡茶、香鬆、脆片等加工品，推昇產業多元發展。如今產品除上架內,外銷超市，更供應國內外GMP藥廠、ISO食品廠，成功帶動歸來牛蒡產業昇級，成為農業社區共榮的領航者。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"萬丹","name":"黃淑女","items":"九層塔、青蔥、芫荽","photo":"","intro":"黃淑女2002年辭去美容美髮教師，返鄉屏東萬丹創立竹林有機農場，專注有機九層塔栽培與多元加工，並創立「樸作良食」品牌，開發青醬、茶包等特色產品。她引進多品種蘿勒並成功復育聖蘿勒，被譽為「九層塔女王」。農場同時推廣契作、教育與體驗活動，榮獲勞動部「微型創業楷模」肯定，成為在地有機農業典範。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"},{"county":"屏東縣","town":"牡丹","name":"丁采綸","items":"雨來菇","photo":"","intro":"丁采綸（小名丁丁），曾任空服員與保險業務，因喜愛屏東特產雨來菇而投入栽培研究，在改良場指導下成為台灣首位通過有機轉型期驗證的雨來菇農友，並獲選第五屆百大青農。她堅持不灌水增重，重視品質與保存性，除自耕外也與農友合作，嚴格要求生產流程。除生鮮與乾燥雨來菇外，更開發九次藻麵、靚多醣素燕窩等產品，並加入有機外銷國家隊，致力推廣雨來菇的美好。","story":"","article":"","status":"待補照片","updated":"2026-10-15","source":"屏東"}];

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const normalize=s=>String(s||"").replaceAll("台","臺").replace("縣市","");
const countyDisplay=s=>String(s||"").replaceAll("臺","台");
const SVGNS="http://www.w3.org/2000/svg";

function rowsForCounty(county) {
  const n=normalize(county);
  if(n==="嘉義市") return farmers.filter(f=>normalize(f.county)==="嘉義" && String(f.town).includes("嘉義市"));
  if(n==="嘉義縣") return farmers.filter(f=>normalize(f.county)==="嘉義" && !String(f.town).includes("嘉義市"));
  return farmers.filter(f=>normalize(f.county)===n);
}
function countyFromFarmer(f) {
  if(f.county==="嘉義縣市") return String(f.town).includes("嘉義市") ? "嘉義市" : "嘉義縣";
  return f.county;
}
const COUNTY_ORDER = [
  "基隆市","台北市","新北市","桃園市","宜蘭縣",
  "新竹市","新竹縣","苗栗縣","台中市","彰化縣","南投縣","雲林縣",
  "嘉義市","嘉義縣","台南市","高雄市","屏東縣",
  "澎湖縣","金門縣","連江縣",
  "花蓮縣","台東縣"
];

function allCountiesWithData() {
  const dataCounties = new Set(farmers.map(countyFromFarmer));
  return COUNTY_ORDER.filter(c => dataCounties.has(c));
}

function fillCountyFilter() {
  const el=document.querySelector("#countyFilter");
  el.innerHTML='<option value="">全部縣市</option>';
  allCountiesWithData().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;el.appendChild(o)});
}
function itemChips(items) { return String(items||"").split("、").filter(Boolean).map(x=>`<span class="item-chip">${esc(x)}</span>`).join(""); }
function renderList(rows,title="全部農友",county="") {
  document.querySelector("#panelTitle").textContent=title;
  document.querySelector("#summary").textContent=`${rows.length} 位農友／生產單位`;
  const countySummary=document.querySelector("#countySummary");
  if(county) {
    const uniqueItems=[...new Set(rows.flatMap(f=>String(f.items||"").split("、").filter(Boolean)))];
    countySummary.innerHTML=`<div class="county-summary"><strong>${esc(county)}</strong><div class="meta" style="margin:4px 0 5px">${rows.length} 位農友／單位，主要供應 ${uniqueItems.length} 種品項</div><div>${uniqueItems.slice(0,18).map(x=>`<span class="item-chip">${esc(x)}</span>`).join("")}</div></div>`;
  } else countySummary.innerHTML="";
  document.querySelector("#list").innerHTML=rows.map(f=>`<div class="farmer" tabindex="0" role="button" data-key="${esc(f.name)}"><div><span class="name">${esc(f.name)}</span><span class="town">${esc(f.town)}</span></div><div class="items">${itemChips(f.items)}</div></div>`).join("") || '<p class="placeholder">目前沒有符合資料。</p>';
  document.querySelectorAll(".farmer").forEach(el=>{
    const open=()=>openFarmer(rows.find(f=>f.name===el.dataset.key) || farmers.find(f=>f.name===el.dataset.key));
    el.addEventListener("click",open);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  });
}
function openFarmer(f) {
  if(!f)return;
  const photo=f.photo?`<img src="${esc(f.photo)}" alt="${esc(f.name)}">`:`<div>📷 農友照片待補</div>`;
  const chips=String(f.items||"").split("、").filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join("");
  document.querySelector("#drawerContent").innerHTML=`<div class="hero">${photo}</div><div class="detail"><h2>${esc(f.name)}</h2><div class="meta">${esc(countyFromFarmer(f))}・${esc(f.town)}</div><div class="supply-title">供應品項</div><div class="chips">${chips}</div><div class="section"><h3>農友介紹</h3><p>${f.intro?esc(f.intro):'<span class="placeholder">待補農友介紹。</span>'}</p></div><div class="section"><h3>產地故事／圖文說明</h3><p>${f.story?esc(f.story):'<span class="placeholder">待補圖文內容。</span>'}</p></div>${f.article?`<div class="section"><a class="btn primary" href="${esc(f.article)}" target="_blank" rel="noopener">閱讀相關文章</a></div>`:""}</div>`;
  const d=document.querySelector("#drawer"); d.classList.add("open"); d.setAttribute("aria-hidden","false");
}
document.querySelector("#close").addEventListener("click",()=>{document.querySelector("#drawer").classList.remove("open");document.querySelector("#drawer").setAttribute("aria-hidden","true")});
document.addEventListener("keydown",e=>{if(e.key==="Escape") document.querySelector("#close").click();});

function updateMapSelection() {
  document.querySelectorAll(".county").forEach(el=>el.classList.toggle("selected", normalize(el.dataset.county)===normalize(selectedCounty)));
}
function setSelectedCounty(county, fromMap=true) {
  hideTip();
  selectedCounty=county||"";
  const filter=document.querySelector("#countyFilter");
  if([...filter.options].some(o=>o.value===selectedCounty)) filter.value=selectedCounty; else filter.value="";
  if(selectedCounty) renderList(rowsForCounty(selectedCounty),selectedCounty,selectedCounty); else renderList(farmers,"全部農友","");
  updateMapSelection();
  if(fromMap) document.querySelector("#search").value="";
}
function applyFilter() {
 const q=document.querySelector("#search").value.trim().toLowerCase();
 const c=document.querySelector("#countyFilter").value;
 selectedCounty=c;
 let rows=farmers.filter(f=>(!c||normalize(countyFromFarmer(f))===normalize(c))&&(!q||[f.name,f.town,f.items,countyFromFarmer(f)].join(" ").toLowerCase().includes(q)));
 renderList(rows,c || (q?`搜尋：${q}`:"全部農友"),c);
 updateMapSelection();
}
document.querySelector("#search").addEventListener("input",applyFilter);
document.querySelector("#countyFilter").addEventListener("change",applyFilter);
document.querySelector("#resetMap").addEventListener("click",()=>{document.querySelector("#search").value="";document.querySelector("#countyFilter").value="";selectedCounty="";renderList(farmers,"全部農友","");updateMapSelection();});

let hideTipTimer=null;
function cancelTipHide(){if(hideTipTimer){clearTimeout(hideTipTimer);hideTipTimer=null;}}
function scheduleHideTip(){cancelTipHide();hideTipTimer=setTimeout(hideTip,320);}
function showTip(event, county) {
  cancelTipHide();
  const rows=rowsForCounty(county);
  const tip=document.querySelector("#tip");
  const hint=rows.length>5?'<div class="tip-scroll-hint">↕ 農友較多，可將滑鼠移入視窗後用滾輪往下瀏覽</div>':'';
  tip.innerHTML=`<div class="tip-head"><h3>${esc(county)}</h3><div class="tip-meta">${rows.length?`${rows.length} 位農友／生產單位`:"目前尚無農友資料"}</div>${hint}</div><div class="tip-scroll">${rows.map(f=>`<div class="tip-row"><div class="tip-name">${esc(f.name)} <span style="font-weight:400;opacity:.75">｜${esc(f.town)}</span></div><div class="tip-items">${esc(f.items)}</div></div>`).join("")||'<div class="tip-row">目前尚無農友資料</div>'}</div>`;
  tip.style.display="block"; positionTip(event);
}
function positionTip(event) {
  const tip=document.querySelector("#tip"); if(tip.style.display==="none") return;
  const pad=12,gap=14,r=tip.getBoundingClientRect(); let x=(event.clientX||20)+gap,y=(event.clientY||20)+gap;
  if(x+r.width>window.innerWidth-pad) x=(event.clientX||20)-r.width-gap;
  if(y+r.height>window.innerHeight-pad) y=Math.max(pad,window.innerHeight-r.height-pad);
  tip.style.left=Math.max(pad,x)+"px"; tip.style.top=Math.max(pad,y)+"px";
}
function hideTip() {cancelTipHide();document.querySelector("#tip").style.display="none";}
const tipEl=document.querySelector("#tip");
tipEl.addEventListener("mouseenter",cancelTipHide);
tipEl.addEventListener("mouseleave",hideTip);
tipEl.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});

function bindCountyElement(el, county) {
  el.dataset.county=county; el.setAttribute("tabindex","0"); el.setAttribute("role","button");
  el.setAttribute("aria-label",`${county}，${rowsForCounty(county).length} 位農友或生產單位`);
  el.addEventListener("mouseenter",e=>showTip(e,county)); el.addEventListener("mousemove",positionTip); el.addEventListener("mouseleave",scheduleHideTip);
  el.addEventListener("focus",e=>{const r=e.currentTarget.getBoundingClientRect();showTip({clientX:r.right,clientY:r.top},county);}); el.addEventListener("blur",scheduleHideTip);
  el.addEventListener("click",()=>setSelectedCounty(county));
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setSelectedCounty(county);}});
}
function svgEl(name,attrs={}) { const el=document.createElementNS(SVGNS,name); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); return el; }
const SMALL_CITY_LABEL_OFFSETS={"台北市":[-22,14],"基隆市":[12,-8],"新竹市":[-12,10],"嘉義市":[-14,0]};
function appendCountyLabel(svg,county,x,y){
  const baseOffset=SMALL_CITY_LABEL_OFFSETS[county]||[0,0];
  const extraOffset=county==="新北市"?[0,22]:[0,0];
  const dx=baseOffset[0]+extraOffset[0], dy=baseOffset[1]+extraOffset[1];
  const lx=x+dx, ly=y+dy, hasData=rowsForCounty(county).length>0;
  if(SMALL_CITY_LABEL_OFFSETS[county]){
    const hit=svgEl("rect",{x:lx-26,y:ly-16,width:52,height:32,rx:8,class:"county-label-hit"});
    bindCountyElement(hit,county); svg.appendChild(hit);
  }
  const t=svgEl("text",{x:lx,y:ly,class:hasData?"county-label":"county-label no-data"});
  t.textContent=county.replace(/[縣市]$/,"");
  bindCountyElement(t,county); svg.appendChild(t);
}

function drawSchematicMap() {
  const svg=document.querySelector("#map"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 600 760");
  const bg=svgEl("rect",{x:0,y:0,width:600,height:760,fill:"#fbfcf8",rx:16}); svg.appendChild(bg);
  SCHEMATIC.forEach(item=>{
    const hasData=rowsForCounty(item.county).length>0; const group=svgEl("g",{class:hasData?"county has":"county no-data",style:`--county-color:${countyColor(item.county)}`}); group.dataset.county=item.county;
    item.parts.forEach(points=>{const poly=svgEl("polygon",{points,class:"map-part"});group.appendChild(poly);});
    bindCountyElement(group,item.county); svg.appendChild(group);
    const [x,y]=item.label; appendCountyLabel(svg,item.county,x,y);
  });
  updateMapSelection();
  document.querySelector("#mapMode").textContent="內建離線行政區互動圖（可直接雙擊 HTML 使用）";
}

// Minimal TopoJSON decoder. When the online county boundary file is available, replace the offline schematic with real boundaries.
function topoArcDecoder(topo) {
  const cache=new Map(); const tr=topo.transform;
  function one(i) {
    const key=i; if(cache.has(key)) return cache.get(key).map(p=>p.slice());
    const rev=i<0; const idx=rev?~i:i; let x=0,y=0;
    let pts=topo.arcs[idx].map(q=>{x+=q[0];y+=q[1];return tr?[x*tr.scale[0]+tr.translate[0],y*tr.scale[1]+tr.translate[1]]:[x,y];});
    if(rev) pts=pts.reverse(); cache.set(key,pts); return pts.map(p=>p.slice());
  }
  return function join(indexes) { let out=[]; indexes.forEach((i,n)=>{let pts=one(i);if(n&&pts.length)pts=pts.slice(1);out=out.concat(pts);});return out; };
}
function geometryPolygons(geom, join) {
  if(geom.type==="Polygon") return [geom.arcs.map(r=>join(r))];
  if(geom.type==="MultiPolygon") return geom.arcs.map(poly=>poly.map(r=>join(r)));
  return [];
}
function geometryRings(geom, join) {
  return geometryPolygons(geom,join).flat();
}
function polygonArea(r) { let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++) a+=(r[j][0]*r[i][1]-r[i][0]*r[j][1]); return Math.abs(a/2); }
function featureArea(f){ return f.rings.reduce((sum,r)=>sum+polygonArea(r),0); }
function createGeoFit(allRings,w,h) {
  const pts=allRings.flat(); let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  pts.forEach(([x,y])=>{if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;});
  const pad=35, sx=(w-2*pad)/(maxX-minX||1), sy=(h-2*pad)/(maxY-minY||1), s=Math.min(sx,sy);
  const ox=(w-(maxX-minX)*s)/2-minX*s, oy=(h-(maxY-minY)*s)/2+maxY*s;
  return ([x,y])=>[x*s+ox,oy-y*s];
}
function ringPath(r,project){
  return r.map((pt,i)=>{const [x,y]=project(pt);return `${i?"L":"M"}${x.toFixed(1)},${y.toFixed(1)}`;}).join(" ")+" Z";
}
async function tryDrawRealMap() {
  try {
    const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),3500);
    const res=await fetch(CONFIG.mapTopoUrl,{signal:ctl.signal,cache:"force-cache"}); clearTimeout(timer);
    if(!res.ok) throw new Error("map HTTP "+res.status); const topo=await res.json();
    const obj=topo.objects.counties || topo.objects[Object.keys(topo.objects).find(k=>k.toLowerCase().includes("count"))]; if(!obj) throw new Error("counties object missing");
    const join=topoArcDecoder(topo);
    const features=obj.geometries.map(g=>{
      const polygons=geometryPolygons(g,join);
      return {
        g,
        polygons,
        rings:polygons.flat(),
        name:countyDisplay(g.properties?.COUNTYNAME||g.properties?.COUNTY||g.properties?.name||"")
      };
    }).filter(f=>f.name && f.rings.length);

    const all=features.flatMap(f=>f.rings);
    const svg=document.querySelector("#map");
    const w=600,h=760, project=createGeoFit(all,w,h);
    svg.innerHTML=""; svg.setAttribute("viewBox",`0 0 ${w} ${h}`);

    // 大區域先畫、小區域後畫，避免台北市被新北市蓋住。
    const ordered=features.slice().sort((a,b)=>featureArea(b)-featureArea(a));
    const labels=[];

    ordered.forEach(f=>{
      const hasData=rowsForCounty(f.name).length>0;
      const group=svgEl("g",{class:hasData?"county has":"county no-data",style:`--county-color:${countyColor(f.name)}`});
      group.dataset.county=f.name;

      // 每個 Polygon 用一個 path，內圈採 evenodd，正確保留行政區中的「洞」。
      f.polygons.forEach(poly=>{
        const d=poly.filter(r=>r.length>=3).map(r=>ringPath(r,project)).join(" ");
        if(d) group.appendChild(svgEl("path",{d,class:"map-part","fill-rule":"evenodd","clip-rule":"evenodd"}));
      });

      bindCountyElement(group,f.name);
      svg.appendChild(group);

      const main=f.rings.slice().sort((a,b)=>polygonArea(b)-polygonArea(a))[0];
      if(main?.length){
        const xs=main.map(p=>project(p)[0]),ys=main.map(p=>project(p)[1]);
        labels.push({name:f.name,x:(Math.min(...xs)+Math.max(...xs))/2,y:(Math.min(...ys)+Math.max(...ys))/2});
      }
    });

    // 所有縣市文字最後再畫，避免被其他行政區圖形遮住。
    labels.forEach(l=>appendCountyLabel(svg,l.name,l.x,l.y));

    updateMapSelection();
    document.querySelector("#mapMode").textContent="精細行政區界線已載入（Taiwan Atlas）";
    return true;
  } catch(e) { console.warn("精細地圖無法連線，使用內建離線地圖",e); return false; }
}
function parseCsv(text) {
  const rows=[]; let row=[],field="",quoted=false;
  const clean=v=>v.endsWith(String.fromCharCode(13))?v.slice(0,-1):v;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted){
      if(c==='"' && n==='"'){field+='"';i++;}
      else if(c==='"') quoted=false;
      else field+=c;
    } else {
      if(c==='"') quoted=true;
      else if(c===','){row.push(clean(field));field="";}
      else if(c.charCodeAt(0)===10){row.push(clean(field));rows.push(row);row=[];field="";}
      else field+=c;
    }
  }
  if(field || row.length){row.push(clean(field));rows.push(row);}
  if(rows.length<2)return[];
  const hdr=rows[0];
  return rows.slice(1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,r[i]||""])));
}
async function tryLoadSheet() {
 if(!CONFIG.sheetCsvUrl) return;
 try { const res=await fetch(CONFIG.sheetCsvUrl); if(!res.ok)throw new Error(res.status); const parsed=parseCsv(await res.text()); if(parsed.length) farmers=parsed.map(r=>({county:r["縣市"]||"",town:r["鄉鎮/區"]||"",name:r["農友/單位"]||"",items:r["供應品項"]||"",photo:r["照片網址"]||"",intro:r["農友介紹"]||"",story:r["圖文說明"]||"",article:r["文章連結"]||"",status:r["資料狀態"]||"",updated:r["最後更新"]||"",source:r["來源縣市標題"]||""})); } catch(e){console.warn("Google Sheet 讀取失敗，改用網站內建資料",e)}
}
(async()=>{
  await tryLoadSheet(); fillCountyFilter(); renderList(farmers); drawSchematicMap();
  // 非必要增強：若能連外，再換成精細真實行政界；失敗不影響使用。
  tryDrawRealMap();
})();
</script>
