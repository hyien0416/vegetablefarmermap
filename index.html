:root{--green:#2f6b3b;--green2:#4f8a55;--cream:#f6f3e8;--ink:#253127;--muted:#66756b;--card:#fff;--line:#d9e1d8;--hover:#f0b94d;--selected:#e69a32;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--ink)}
header{padding:26px 24px 18px;background:linear-gradient(135deg,#285e34,#4d874d);color:#fff}
header h1{margin:0 0 8px;font-size:clamp(25px,4vw,42px)} header p{margin:0;opacity:.94;line-height:1.75;max-width:900px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
input,select,button,a.btn{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);text-decoration:none}
input{min-width:220px;flex:1} button,.btn{cursor:pointer} .primary{background:var(--green);color:#fff!important;border-color:var(--green)}
.legend{display:flex;gap:15px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 2px 10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)} .dot.has{background:linear-gradient(135deg,#6ea8d9,#e1a35b,#7fba78)} .dot.none{background:rgba(150,160,150,.45)} .dot.sel{background:var(--selected)}
.layout{display:grid;grid-template-columns:minmax(390px,1.15fr) minmax(330px,.85fr);gap:18px;padding:18px;max-width:1440px;margin:auto}
.mapcard,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(32,64,38,.06)}
.mapcard{padding:14px;min-height:700px;position:relative} #map{width:100%;height:640px;display:block}
.map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px 4px 8px}
.map-head h2{margin:0;font-size:20px} .map-head p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.county{fill:var(--county-color,#dfe5dd);stroke:#fff;stroke-width:1.35;cursor:pointer;transition:fill .15s,filter .15s,stroke-width .15s,opacity .15s;outline:none}
.county.has{opacity:1}.county.no-data{opacity:.55}
.county:hover,.county:focus{fill:var(--hover);opacity:1;stroke-width:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}.county.selected{fill:var(--selected);opacity:1;stroke-width:2}
.county-label{font-size:13px;font-weight:800;fill:#1f3625;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.county-label.no-data{fill:#758078;font-weight:600;font-size:11.5px}
.tip{position:fixed;display:none;pointer-events:auto;z-index:60;width:min(410px,calc(100vw - 24px));max-height:72vh;overflow:hidden;background:#203827;color:#fff;padding:0;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.24);font-size:14px;line-height:1.55;cursor:default}
.tip-head{padding:13px 15px 9px;background:#203827;border-bottom:1px solid rgba(255,255,255,.14)}
.tip h3{margin:0 0 5px;font-size:18px}.tip .tip-meta{opacity:.78;margin-bottom:3px}.tip-scroll-hint{font-size:12px;color:#d9eadc;margin-top:5px}
.tip-scroll{max-height:min(55vh,470px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:0 15px 10px}
.tip-scroll::-webkit-scrollbar{width:9px}.tip-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:10px}.tip-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.34);border-radius:10px}

.panel{padding:18px;height:700px;overflow:auto} .panel h2{margin:0 0 7px} .meta{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5}
.county-summary{background:#f2f7ee;border:1px solid #dfe9da;padding:12px;border-radius:14px;margin-bottom:12px} .county-summary strong{font-size:18px}

.section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px} .placeholder{color:#869288;font-style:italic}

<body>
<header>
  <h1>合作社蔬菜農友互動地圖</h1>
  <p>把菜從哪裡來、由誰種、供應什麼，一張台灣行政區地圖看懂。滑鼠移到縣市可直接查看農友與供應品項；點縣市固定清單，再點農友看完整品項與介紹。</p>
</header>
<div class="toolbar">
  <input id="search" placeholder="搜尋農友、鄉鎮或蔬菜品項…" aria-label="搜尋農友、鄉鎮或蔬菜品項">
  <select id="countyFilter" aria-label="篩選縣市"><option value="">全部縣市</option></select>
  <button id="resetMap" type="button">回到全部</button>
</div>
<main class="layout">
  <section class="mapcard">
    <div class="map-head"><div><h2>台灣縣市行政區</h2><p>各縣市以不同顏色區分；半透明＝目前尚無農友資料。滑鼠移入或點擊縣市查看。</p></div></div>
    <div class="legend"><span><i class="dot has"></i>各縣市不同顏色</span><span><i class="dot none"></i>半透明＝尚無資料</span><span><i class="dot sel"></i>橘色＝目前選取</span></div><div id="mapMode" class="map-note">內建離線行政區互動圖</div>
    <svg id="map" role="img" aria-label="台灣縣市行政區互動地圖"></svg>
    <div id="tip" class="tip" aria-live="polite"></div>
  </section>
  <aside class="panel">
    <h2 id="panelTitle">全部農友</h2>
    <div class="meta" id="summary"></div>
    <div id="countySummary"></div>
    <div id="list"></div>
  </aside>
</main>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="close" id="close" type="button">✕ 關閉</button>
  <div id="drawerContent"></div>
</aside>
<footer>資料初版：2026/10/02 ｜ 地圖：各縣市不同色彩；浮動農友清單可滾輪瀏覽；連線可用時自動套用 Taiwan Atlas 行政區界</footer>

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function rowsForCounty(county) {
  const n=normalize(county);
  if(n==="嘉義市") return farmers.filter(f=>normalize(f.county)==="嘉義" && String(f.town).includes("嘉義市"));
  if(n==="嘉義縣") return farmers.filter(f=>normalize(f.county)==="嘉義" && !String(f.town).includes("嘉義市"));
  return farmers.filter(f=>normalize(f.county)===n);
}
function countyFromFarmer(f) {
  if(f.county==="嘉義縣市") return String(f.town).includes("嘉義市") ? "嘉義市" : "嘉義縣";
  return f.county;
}

  "基隆市","台北市","新北市","桃園市","宜蘭縣",

];

function allCountiesWithData() {
  const dataCounties = new Set(farmers.map(countyFromFarmer));
  return COUNTY_ORDER.filter(c => dataCounties.has(c));
}

function fillCountyFilter() {
  const el=document.querySelector("#countyFilter");

}
function itemChips(items) { return String(items||"").split("、").filter(Boolean).map(x=>`<span class="item-chip">${esc(x)}</span>`).join(""); }
function renderList(rows,title="全部農友",county="") {
  document.querySelector("#panelTitle").textContent=title;
  document.querySelector("#summary").textContent=`${rows.length} 位農友／生產單位`;
  const countySummary=document.querySelector("#countySummary");
  if(county) {
    const uniqueItems=[...new Set(rows.flatMap(f=>String(f.items||"").split("、").filter(Boolean)))];
    countySummary.innerHTML=`<div class="county-summary"><strong>${esc(county)}</strong><div class="meta" style="margin:4px 0 5px">${rows.length} 位農友／單位，主要供應 ${uniqueItems.length} 種品項</div><div>${uniqueItems.slice(0,18).map(x=>`<span class="item-chip">${esc(x)}</span>`).join("")}</div></div>`;
  } else countySummary.innerHTML="";
  document.querySelector("#list").innerHTML=rows.map(f=>`<div class="farmer" tabindex="0" role="button" data-key="${esc(f.name)}"><div><span class="name">${esc(f.name)}</span><span class="town">${esc(f.town)}</span></div><div class="items">${itemChips(f.items)}</div></div>`).join("") || '<p class="placeholder">目前沒有符合資料。</p>';
  document.querySelectorAll(".farmer").forEach(el=>{
    const open=()=>openFarmer(rows.find(f=>f.name===el.dataset.key) || farmers.find(f=>f.name===el.dataset.key));

function openFarmer(f) {

document.querySelector("#resetMap").addEventListener("click",()=>{document.querySelector("#search").value="";document.querySelector("#countyFilter").value="";selectedCounty="";renderList(farmers,"全部農友","");updateMapSelection();});

let hideTipTimer=null;
function cancelTipHide(){if(hideTipTimer){clearTimeout(hideTipTimer);hideTipTimer=null;}}
function scheduleHideTip(){cancelTipHide();hideTipTimer=setTimeout(hideTip,320);}
function showTip(event, county) {
  cancelTipHide();
  const rows=rowsForCounty(county);
  const tip=document.querySelector("#tip");
  const hint=rows.length>5?'<div class="tip-scroll-hint">↕ 農友較多，可將滑鼠移入視窗後用滾輪往下瀏覽</div>':'';
  tip.innerHTML=`<div class="tip-head"><h3>${esc(county)}</h3><div class="tip-meta">${rows.length?`${rows.length} 位農友／生產單位`:"目前尚無農友資料"}</div>${hint}</div><div class="tip-scroll">${rows.map(f=>`<div class="tip-row"><div class="tip-name">${esc(f.name)} <span style="font-weight:400;opacity:.75">｜${esc(f.town)}</span></div><div class="tip-items">${esc(f.items)}</div></div>`).join("")||'<div class="tip-row">目前尚無農友資料</div>'}</div>`;
  tip.style.display="block"; positionTip(event);
}
function positionTip(event) {
  const tip=document.querySelector("#tip"); if(tip.style.display==="none") return;
  const pad=12,gap=14,r=tip.getBoundingClientRect(); let x=(event.clientX||20)+gap,y=(event.clientY||20)+gap;
  if(x+r.width>window.innerWidth-pad) x=(event.clientX||20)-r.width-gap;
  if(y+r.height>window.innerHeight-pad) y=Math.max(pad,window.innerHeight-r.height-pad);
  tip.style.left=Math.max(pad,x)+"px"; tip.style.top=Math.max(pad,y)+"px";
}
function hideTip() {cancelTipHide();document.querySelector("#tip").style.display="none";}
const tipEl=document.querySelector("#tip");
tipEl.addEventListener("mouseenter",cancelTipHide);
tipEl.addEventListener("mouseleave",hideTip);
tipEl.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});

function bindCountyElement(el, county) {
  el.dataset.county=county; el.setAttribute("tabindex","0"); el.setAttribute("role","button");
  el.setAttribute("aria-label",`${county}，${rowsForCounty(county).length} 位農友或生產單位`);
  el.addEventListener("mouseenter",e=>showTip(e,county)); el.addEventListener("mousemove",positionTip); el.addEventListener("mouseleave",scheduleHideTip);
  el.addEventListener("focus",e=>{const r=e.currentTarget.getBoundingClientRect();showTip({clientX:r.right,clientY:r.top},county);}); el.addEventListener("blur",scheduleHideTip);
  el.addEventListener("click",()=>setSelectedCounty(county));
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setSelectedCounty(county);}});
}
function svgEl(name,attrs={}) { const el=document.createElementNS(SVGNS,name); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); return el; }

function drawSchematicMap() {
  const svg=document.querySelector("#map"); svg.innerHTML=""; svg.setAttribute("viewBox","0 0 600 760");
  const bg=svgEl("rect",{x:0,y:0,width:600,height:760,fill:"#fbfcf8",rx:16}); svg.appendChild(bg);
  SCHEMATIC.forEach(item=>{
    const hasData=rowsForCounty(item.county).length>0; const group=svgEl("g",{class:hasData?"county has":"county no-data",style:`--county-color:${countyColor(item.county)}`}); group.dataset.county=item.county;
    item.parts.forEach(points=>{const poly=svgEl("polygon",{points,class:"map-part"});group.appendChild(poly);});
    bindCountyElement(group,item.county); svg.appendChild(group);
    const [x,y]=item.label; const t=svgEl("text",{x,y,class:rowsForCounty(item.county).length?"county-label":"county-label no-data"});
    t.textContent=item.county.replace(/[縣市]$/,""); svg.appendChild(t);
  });
  updateMapSelection();
  document.querySelector("#mapMode").textContent="內建離線行政區互動圖（可直接雙擊 HTML 使用）";
}

// Minimal TopoJSON decoder. When the online county boundary file is available, replace the offline schematic with real boundaries.
function topoArcDecoder(topo) {
  const cache=new Map(); const tr=topo.transform;
  function one(i) {
    const key=i; if(cache.has(key)) return cache.get(key).map(p=>p.slice());
    const rev=i<0; const idx=rev?~i:i; let x=0,y=0;
    let pts=topo.arcs[idx].map(q=>{x+=q[0];y+=q[1];return tr?[x*tr.scale[0]+tr.translate[0],y*tr.scale[1]+tr.translate[1]]:[x,y];});
    if(rev) pts=pts.reverse(); cache.set(key,pts); return pts.map(p=>p.slice());
  }
  return function join(indexes) { let out=[]; indexes.forEach((i,n)=>{let pts=one(i);if(n&&pts.length)pts=pts.slice(1);out=out.concat(pts);});return out; };
}
function geometryRings(geom, join) {
  if(geom.type==="Polygon") return geom.arcs.map(r=>join(r));
  if(geom.type==="MultiPolygon") return geom.arcs.flatMap(poly=>poly.map(r=>join(r)));
  return [];
}
function polygonArea(r) { let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++) a+=(r[j][0]*r[i][1]-r[i][0]*r[j][1]); return Math.abs(a/2); }
function createGeoFit(allRings,w,h) {
  const pts=allRings.flat(); let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  pts.forEach(([x,y])=>{if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;});
  const pad=35, sx=(w-2*pad)/(maxX-minX||1), sy=(h-2*pad)/(maxY-minY||1), s=Math.min(sx,sy);
  const ox=(w-(maxX-minX)*s)/2-minX*s, oy=(h-(maxY-minY)*s)/2+maxY*s;
  return ([x,y])=>[x*s+ox,oy-y*s];
}
async function tryDrawRealMap() {
  try {
    const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),3500);
    const res=await fetch(CONFIG.mapTopoUrl,{signal:ctl.signal,cache:"force-cache"}); clearTimeout(timer);
    if(!res.ok) throw new Error("map HTTP "+res.status); const topo=await res.json();
    const obj=topo.objects.counties || topo.objects[Object.keys(topo.objects).find(k=>k.toLowerCase().includes("count"))]; if(!obj) throw new Error("counties object missing");
    const join=topoArcDecoder(topo); const features=obj.geometries.map(g=>({g,rings:geometryRings(g,join),name:countyDisplay(g.properties?.COUNTYNAME||g.properties?.COUNTY||g.properties?.name||"")}));
    const all=features.flatMap(f=>f.rings); const svg=document.querySelector("#map"); const w=600,h=760, project=createGeoFit(all,w,h); svg.innerHTML="";svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
    features.forEach(f=>{
      if(!f.name)return; const hasData=rowsForCounty(f.name).length>0; const group=svgEl("g",{class:hasData?"county has":"county no-data",style:`--county-color:${countyColor(f.name)}`}); group.dataset.county=f.name;
      f.rings.forEach(r=>{if(r.length<3)return; const d=r.map((pt,i)=>{const [x,y]=project(pt);return `${i?"L":"M"}${x.toFixed(1)},${y.toFixed(1)}`;}).join(" ")+" Z"; group.appendChild(svgEl("path",{d,class:"map-part"}));});
      bindCountyElement(group,f.name); svg.appendChild(group);
      const main=f.rings.slice().sort((a,b)=>polygonArea(b)-polygonArea(a))[0]; if(main?.length){ const xs=main.map(p=>project(p)[0]),ys=main.map(p=>project(p)[1]); const x=(Math.min(...xs)+Math.max(...xs))/2,y=(Math.min(...ys)+Math.max(...ys))/2; const t=svgEl("text",{x,y,class:rowsForCounty(f.name).length?"county-label":"county-label no-data"});t.textContent=f.name.replace(/[縣市]$/,"");svg.appendChild(t); }
    });
    updateMapSelection(); document.querySelector("#mapMode").textContent="精細行政區界線已載入（Taiwan Atlas）"; return true;
  } catch(e) { console.warn("精細地圖無法連線，使用內建離線地圖",e); return false; }
}
function parseCsv(text) {
  const rows=[]; let row=[],field="",quoted=false;
  const clean=v=>v.endsWith(String.fromCharCode(13))?v.slice(0,-1):v;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted){
      if(c==='"' && n==='"'){field+='"';i++;}
      else if(c==='"') quoted=false;
      else field+=c;
    } else {
      if(c==='"') quoted=true;
      else if(c===','){row.push(clean(field));field="";}
      else if(c.charCodeAt(0)===10){row.push(clean(field));rows.push(row);row=[];field="";}
      else field+=c;
    }
  }
  if(field || row.length){row.push(clean(field));rows.push(row);}
  if(rows.length<2)return[];
  const hdr=rows[0];
  return rows.slice(1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,r[i]||""])));
}
async function tryLoadSheet() {
 if(!CONFIG.sheetCsvUrl) return;
 try { const res=await fetch(CONFIG.sheetCsvUrl); if(!res.ok)throw new Error(res.status); const parsed=parseCsv(await res.text()); if(parsed.length) farmers=parsed.map(r=>({county:r["縣市"]||"",town:r["鄉鎮/區"]||"",name:r["農友/單位"]||"",items:r["供應品項"]||"",photo:r["照片網址"]||"",intro:r["農友介紹"]||"",story:r["圖文說明"]||"",article:r["文章連結"]||"",status:r["資料狀態"]||"",updated:r["最後更新"]||"",source:r["來源縣市標題"]||""})); } catch(e){console.warn("Google Sheet 讀取失敗，改用網站內建資料",e)}
}
(async()=>{
  await tryLoadSheet(); fillCountyFilter(); renderList(farmers); drawSchematicMap();
  // 非必要增強：若能連外，再換成精細真實行政界；失敗不影響使用。
  tryDrawRealMap();
})();
</script>
